<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Cake 🎂</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="page-cake">

    <canvas id="fireworks"></canvas>

    <div id="confetti-container"></div>
    <div id="balloon-container"></div>


    <nav class="navbar">

        <div class="logo">
            🎂 BESTIE
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="memories.html">Memories</a>
            <a href="photo.html">Photos</a>
            <a href="letter.html">Letter</a>

            <a class="active" href="cake.html">
                Cake
            </a>

            <a href="surprise.html">Surprise</a>

        </div>

    </nav>


    <section class="cake-section">

        <div class="section-heading">

            <span>🎂 MAKE A WISH</span>

            <h1>
                Your Birthday
                <span>Cake Is Here!</span>
            </h1>

            <p>
                Close your eyes, make a wish and blow out
                the candles.
            </p>

        </div>


        <div class="cake-wrapper">

            <div class="candle candle-one">
                <div class="flame"></div>
            </div>

            <div class="candle candle-two">
                <div class="flame"></div>
            </div>

            <div class="candle candle-three">
                <div class="flame"></div>
            </div>


            <div class="cake-top">

                <div class="cream cream-one"></div>
                <div class="cream cream-two"></div>
                <div class="cream cream-three"></div>

            </div>


            <div class="cake-middle">

                <div class="cake-decoration"></div>

                <span>HAPPY</span>

            </div>


            <div class="cake-bottom">

                <span>
                    BIRTHDAY
                </span>

            </div>

            <div class="plate"></div>

        </div>


        <button class="wish-btn" onclick="makeWish()">
            ✨ Make A Wish ✨
        </button>


        <div id="wishMessage" class="wish-message">

            🎉 Your wish has been sent into the universe! 🎉

        </div>


        <div class="navigation-buttons">

            <a href="letter.html" class="secondary-btn">
                ← Letter
            </a>

            <a href="surprise.html" class="main-btn">
                Final Surprise 🎁 →
            </a>

        </div>

    </section>


    <script src="js/script.js"></script>

</body>
</html>
